name: Build JibunKit IPA

on:
  workflow_dispatch:
    inputs:
      background_location_validation:
        description: P2-B combined background/location native Feature tests and diagnostic IPA
        type: boolean
        default: false
      package_sdk_aliases_only:
        description: SDK aliases only; simulator_tests selects iOS host, otherwise macOS (no IPA)
        type: boolean
        default: false
      simulator_tests:
        description: Run integration UI checks on an iOS simulator
        type: boolean
        default: false
      continuing_state_validation:
        description: Run P2-L real Feature storage/management/restore regression in parallel with the normal IPA
        type: boolean
        default: false
      media_validation:
        description: Run the combined P2-C audio/capture native tests and diagnostic IPA in parallel
        type: boolean
        default: false
      feature_validation:
        description: Verify standalone Features, template generation and host integration
        type: boolean
        default: false
      generated_validation_only:
        description: Retry generated host and Records UI; reuse prior normal, requirements and standalone Notes evidence
        type: boolean
        default: false
      records_validation:
        description: Include Records standalone build and UI (disable only when reusing unchanged successful evidence)
        type: boolean
        default: true
      split_generated_ui:
        description: Split generated-only UI into network and web-management jobs (requires explicit methods and Records reuse)
        type: boolean
        default: false
      generated_ui_shard:
        description: Select a split UI job only when the other job has unchanged verified evidence
        type: choice
        options:
          - both
          - network
          - web-management
        default: both
      p1_device_validation:
        description: Build the complete P1 device diagnostic IPA and validate its embedded HTTP fixture
        type: boolean
        default: false
      p1_device_http_validation:
        description: Run embedded HTTP XCTest (disable only when unchanged passed evidence is recorded)
        type: boolean
        default: true
      simulator_runtime:
        description: iOS simulator version (empty selects latest installed iOS 26)
        type: string
        default: ''
      package_intents_validation:
        description: Compare independent and combined package App Intents (requires simulator_tests)
        type: boolean
        default: false
      package_widgets_validation:
        description: Compare independent and combined package Widgets (requires simulator_tests)
        type: boolean
        default: false
      interactive_widgets_validation:
        description: P2-W independent/combined native contracts and normal host diagnostic in parallel (requires simulator_tests)
        type: boolean
        default: false
      incoming_validation:
        description: Native incoming provider/ownership tests in a parallel iOS job (requires simulator_tests)
        type: boolean
        default: false
      package_resources_validation:
        description: Compare package resources and generated-host localization (requires simulator_tests; host check also requires feature_validation)
        type: boolean
        default: false
      web_authentication_validation:
        description: Run native web authentication comparison (requires simulator_tests)
        type: boolean
        default: false
      background_urlsession_validation:
        description: Compare native background downloads (requires simulator_tests)
        type: boolean
        default: false
      backgroundtasks_validation:
        description: Compare native BackgroundTasks pending requests (requires simulator_tests)
        type: boolean
        default: false
      backgroundtasks_compile_only:
        description: Compile native BackgroundTasks fixture; shared refresh iOS unit tests still run
        type: boolean
        default: false
      feature_ui_test_filter:
        description: Optional generated-host Xcode test identifier (empty runs all Feature integration tests)
        type: string
        default: ''
      ui_test_filter:
        description: Optional Xcode test identifier for focused diagnostics (empty runs the normal suite)
        type: string
        default: ''
      focused_ui_validation:
        description: Run only one ui_test_filter target and skip normal build and regression stages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  background-location:
    if: inputs.background_location_validation && !inputs.package_sdk_aliases_only
    uses: ./.github/workflows/native-surface.yml
    with:
      surface: background-location
      ios_major: '27'
      simulator_runtime: ${{ inputs.simulator_runtime }}

  media:
    if: inputs.media_validation && !inputs.package_sdk_aliases_only
    uses: ./.github/workflows/native-surface.yml
    with:
      surface: media
      simulator_runtime: ${{ inputs.simulator_runtime }}

  continuing-state:
    if: inputs.continuing_state_validation && !inputs.package_sdk_aliases_only
    uses: ./.github/workflows/native-surface.yml
    with:
      surface: continuing-state
      simulator_runtime: ${{ inputs.simulator_runtime }}

  interactive-widgets:
    if: inputs.interactive_widgets_validation && inputs.simulator_tests && !inputs.package_sdk_aliases_only
    uses: ./.github/workflows/native-surface.yml
    with:
      surface: interactive-widgets
      simulator_runtime: ${{ inputs.simulator_runtime }}

  device-http-native:
    if: inputs.p1_device_validation && inputs.p1_device_http_validation && inputs.simulator_tests && !inputs.package_sdk_aliases_only
    uses: ./.github/workflows/native-surface.yml
    with:
      surface: device-http
      simulator_runtime: ${{ inputs.simulator_runtime }}

  intents-native:
    if: inputs.package_intents_validation && inputs.simulator_tests && !inputs.package_sdk_aliases_only
    uses: ./.github/workflows/native-surface.yml
    with:
      surface: intents
      simulator_runtime: ${{ inputs.simulator_runtime }}

  widgets-native:
    if: inputs.package_widgets_validation && inputs.simulator_tests && !inputs.package_sdk_aliases_only
    uses: ./.github/workflows/native-surface.yml
    with:
      surface: widgets
      simulator_runtime: ${{ inputs.simulator_runtime }}

  incoming-native:
    if: inputs.incoming_validation && inputs.simulator_tests && !inputs.package_sdk_aliases_only
    uses: ./.github/workflows/native-surface.yml
    with:
      surface: incoming
      simulator_runtime: ${{ inputs.simulator_runtime }}

  web-authentication-native:
    if: inputs.web_authentication_validation && inputs.simulator_tests && !inputs.package_sdk_aliases_only
    uses: ./.github/workflows/native-surface.yml
    with:
      surface: web-authentication
      simulator_runtime: ${{ inputs.simulator_runtime }}

  package-sdk-aliases:
    if: inputs.package_sdk_aliases_only
    name: Native Swift SDK module aliases
    runs-on: macos-26
    timeout-minutes: 20
    env:
      TUIST_VERSION: "4.207.0"
      TUIST_SHA256: 583fec75cc187bb84a30509ba5afe7455607547be0917fdcf5899a7ef338305e
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode 26.6 Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          swift --version
      - name: Compare standalone and combined SDK packages
        if: ${{ !inputs.simulator_tests }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/verify-package-sdk-aliases.py --evidence-dir "$RUNNER_TEMP/PackageSDKAliases"
      - name: Install pinned Tuist
        if: inputs.simulator_tests
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tuist.zip" \
            "https://github.com/tuist/tuist/releases/download/$TUIST_VERSION/tuist.zip"
          echo "$TUIST_SHA256  $RUNNER_TEMP/tuist.zip" | shasum --algorithm 256 --check
          mkdir -p "$RUNNER_TEMP/tuist"
          ditto -x -k "$RUNNER_TEMP/tuist.zip" "$RUNNER_TEMP/tuist"
          echo "$RUNNER_TEMP/tuist" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tuist/tuist" version

      - name: Prepare simulator tests
        if: inputs.simulator_tests
        env:
          REQUESTED_RUNTIME: ${{ inputs.simulator_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          sim_id="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, os, sys
          devices = json.load(open(sys.argv[1]))['devices']
          runtimes = [runtime for runtime in devices if 'iOS-26' in runtime]
          requested = os.environ.get('REQUESTED_RUNTIME', '')
          if requested:
              runtimes = [runtime for runtime in runtimes if runtime.endswith('iOS-' + requested.replace('.', '-'))]
          if not runtimes:
              raise SystemExit('Requested iOS simulator runtime is not installed')
          runtime = max(runtimes, key=lambda value: tuple(map(int, value.split('iOS-')[1].split('-'))))
          candidates = [d for d in devices[runtime]
                        if d['name'].startswith('iPhone') and d['isAvailable']]
          if not candidates:
              raise SystemExit('No available iOS 26 iPhone simulator')
          candidates.sort(key=lambda d: (d['name'] != 'iPhone 16e', d['name']))
          print(candidates[0]['udid'])
          PY
          )"
          echo "SIMULATOR_ID=$sim_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$sim_id"
          xcrun simctl bootstatus "$sim_id" -b

      - name: Verify SDK aliases in Tuist iOS host
        if: inputs.simulator_tests
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/verify-package-sdk-aliases-ios.py --simulator-id "$SIMULATOR_ID" \
            --evidence-dir "$RUNNER_TEMP/PackageSDKAliasesIOS"
      - name: Upload SDK alias diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Package-SDK-alias-diagnostics
          path: |
            ${{ runner.temp }}/PackageSDKAliases/*.log
            ${{ runner.temp }}/PackageSDKAliases/summary.json
            ${{ runner.temp }}/PackageSDKAliasesIOS/*.log
            ${{ runner.temp }}/PackageSDKAliasesIOS/ios-summary.json
            ${{ runner.temp }}/PackageSDKAliasesIOS/SDKAliasIOS.xcresult
          if-no-files-found: warn
          retention-days: 7

  build:
    if: ${{ !inputs.package_sdk_aliases_only }}
    name: Xcode 26.6 (${{ matrix.lane }}${{ matrix.ui_shard != 'all' && format('-{0}', matrix.ui_shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # One completion boundary, independent normal and generated host jobs.
        # Focused and build-only calls retain the existing combined behavior.
        lane: ${{ fromJSON((inputs.generated_validation_only || inputs.split_generated_ui) && '["generated"]' || inputs.feature_validation && inputs.simulator_tests && !inputs.focused_ui_validation && inputs.ui_test_filter == '' && '["normal","generated"]' || '["combined"]') }}
        ui_shard: ${{ fromJSON(inputs.split_generated_ui && ((inputs.generated_ui_shard == 'network' || inputs.generated_ui_shard == 'web-management') && format('["{0}"]', inputs.generated_ui_shard) || '["network","web-management"]') || '["all"]') }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TUIST_VERSION: "4.207.0"
      TUIST_SHA256: 583fec75cc187bb84a30509ba5afe7455607547be0917fdcf5899a7ef338305e
      EVIDENCE_SUFFIX: ${{ matrix.lane == 'generated' && '-generated' || '' }}${{ matrix.ui_shard != 'all' && format('-{0}', matrix.ui_shard) || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate individual generated shard
        env:
          SHARD: ${{ inputs.generated_ui_shard }}
          SPLIT: ${{ inputs.split_generated_ui }}
        run: |
          case "$SHARD" in
            ''|both) ;;
            network|web-management) test "$SPLIT" = true ;;
            *) exit 2 ;;
          esac

      - name: Validate generated-only retry
        if: inputs.generated_validation_only
        env:
          VALID: ${{ inputs.feature_validation && inputs.simulator_tests && !inputs.focused_ui_validation && inputs.ui_test_filter == '' }}
        run: |
          if [[ "$VALID" != true ]]; then
            echo "generated_validation_only requires feature_validation + simulator_tests, no focused/normal UI filter" >&2
            exit 1
          fi

      - name: Validate split generated boundary
        if: inputs.split_generated_ui
        env:
          VALID: ${{ inputs.generated_validation_only && inputs.feature_validation && inputs.simulator_tests && !inputs.focused_ui_validation && !inputs.records_validation && inputs.ui_test_filter == '' }}
          FEATURE_FILTER: ${{ inputs.feature_ui_test_filter }}
        run: |
          test "$VALID" = true
          python3 Tools/split-generated-ui.py --filter "$FEATURE_FILTER" --shard network
          python3 Tools/split-generated-ui.py --filter "$FEATURE_FILTER" --shard web-management

      - name: Validate P1 device candidate boundary
        if: inputs.p1_device_validation
        env:
          VALID: ${{ inputs.simulator_tests && inputs.feature_validation && !inputs.focused_ui_validation && inputs.ui_test_filter == '' && !inputs.records_validation }}
          FEATURE_FILTER: ${{ inputs.feature_ui_test_filter }}
        run: |
          test "$VALID" = true
          # Registry composition is fixed independently of the selected tests.
          # Require explicit methods; reuse of other evidence belongs in preflight.
          python3 Tools/split-generated-ui.py --filter "$FEATURE_FILTER" --shard all

      - name: Check publication boundary
        shell: bash
        run: |
          set -euo pipefail
          forbidden=0

          while IFS= read -r -d '' path; do
            case "$path" in
              .env|*/.env|.env.*|*/.env.*)
                if [[ "$path" != ".env.example" && "$path" != */.env.example ]]; then
                  echo "Forbidden credential file is tracked: $path"
                  forbidden=1
                fi
                ;;
              *.p8|*.p12|*.pfx|*.pem|*.key|*.cer|*.der|*.mobileprovision|*.provisionprofile|*.mobiledevicepairing|*.xip|*.ipa|*.xcarchive)
                echo "Forbidden private or generated file is tracked: $path"
                forbidden=1
                ;;
            esac
          done < <(git ls-files -z)

          secret_pattern='-----BEGIN .*PRIVATE'" KEY-----|github_"'pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}'
          if git grep -nI -E -- "$secret_pattern" -- .; then
            echo "Potential credential content is tracked."
            forbidden=1
          fi

          test "$forbidden" -eq 0

      - name: Validate package App Intents inputs
        if: inputs.package_intents_validation && !inputs.simulator_tests
        run: |
          echo "package_intents_validation requires simulator_tests" >&2
          exit 1

      - name: Validate incoming inputs
        if: inputs.incoming_validation && !inputs.simulator_tests
        run: |
          echo "incoming_validation requires simulator_tests" >&2
          exit 1

      - name: Validate package Widget inputs
        if: inputs.package_widgets_validation && !inputs.simulator_tests
        run: |
          echo "package_widgets_validation requires simulator_tests" >&2
          exit 1

      - name: Validate package resource inputs
        if: inputs.package_resources_validation && !inputs.simulator_tests
        run: |
          echo "package_resources_validation requires simulator_tests" >&2
          exit 1

      - name: Validate web authentication inputs
        if: inputs.web_authentication_validation && !inputs.simulator_tests
        run: |
          echo "web_authentication_validation requires simulator_tests" >&2
          exit 1

      - name: Validate background URLSession inputs
        if: inputs.background_urlsession_validation && !inputs.simulator_tests
        run: |
          echo "background_urlsession_validation requires simulator_tests" >&2
          exit 1

      - name: Validate BackgroundTasks inputs
        if: inputs.backgroundtasks_validation && !inputs.simulator_tests
        run: |
          echo "backgroundtasks_validation requires simulator_tests" >&2
          exit 1

      - name: Validate BackgroundTasks compile-only inputs
        if: inputs.backgroundtasks_compile_only && !inputs.backgroundtasks_validation
        run: |
          echo "backgroundtasks_compile_only requires backgroundtasks_validation" >&2
          exit 1

      - name: Validate focused UI inputs
        if: inputs.focused_ui_validation
        env:
          UI_TEST_FILTER: ${{ inputs.ui_test_filter }}
          FEATURE_UI_TEST_FILTER: ${{ inputs.feature_ui_test_filter }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.simulator_tests }}" != "true" ]]; then
            echo "error: ui_test_filter requires simulator_tests=true" >&2
            exit 1
          fi
          if [[ -z "$UI_TEST_FILTER" ]]; then
            echo "error: focused_ui_validation requires ui_test_filter" >&2
            exit 1
          fi
          if [[ "${{ (inputs.feature_validation && matrix.lane != 'normal') }}" == "true" ]]; then
            echo "error: focused ui_test_filter cannot be combined with feature_validation" >&2
            exit 1
          fi
          if [[ -n "$FEATURE_UI_TEST_FILTER" ]]; then
            echo "error: focused_ui_validation cannot use feature_ui_test_filter" >&2
            exit 1
          fi
          python3 Tools/validate-focused-ui-test.py "$UI_TEST_FILTER"

      - name: Validate selected simulator tests
        if: inputs.simulator_tests
        env:
          UI_TEST_FILTER: ${{ inputs.ui_test_filter }}
          FEATURE_UI_TEST_FILTER: ${{ inputs.feature_ui_test_filter }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$UI_TEST_FILTER" ]]; then
            python3 Tools/validate-focused-ui-test.py "$UI_TEST_FILTER" --allow-suite
          fi
          if [[ "${{ (inputs.feature_validation && matrix.lane != 'normal') }}" == "true" ]]; then
            IFS=',' read -r -a feature_filters <<< "${FEATURE_UI_TEST_FILTER:-MigrationUITests/GeneratedFeatureUITests}"
            for feature_filter in "${feature_filters[@]}"; do
              python3 Tools/validate-focused-ui-test.py "$feature_filter" --allow-suite \
                --source-root UITests --source-root Tests/TemplateIntegration --source-root Tests/PackageWidgets
            done
          fi

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"

      - name: Install pinned Tuist
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tuist.zip" \
            "https://github.com/tuist/tuist/releases/download/$TUIST_VERSION/tuist.zip"
          echo "$TUIST_SHA256  $RUNNER_TEMP/tuist.zip" | shasum --algorithm 256 --check
          mkdir -p "$RUNNER_TEMP/tuist"
          ditto -x -k "$RUNNER_TEMP/tuist.zip" "$RUNNER_TEMP/tuist"
          echo "$RUNNER_TEMP/tuist" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tuist/tuist" version

      - name: Test shared feature logic
        timeout-minutes: 10
        if: ${{ matrix.lane != 'generated' && (!inputs.focused_ui_validation) }}
        shell: bash
        run: python3 Tests/Fixtures/network_server.py --run-tests

      - name: Verify Feature build requirements
        if: ${{ !inputs.focused_ui_validation && !inputs.generated_validation_only }}
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          check_native() {
            if "$@"; then
              echo "passed native command: $*"
            else
              echo "failed native command: $*" >&2
              failures=$((failures + 1))
            fi
          }
          args=(python3 Tools/verify-feature-build-requirements.py --tuist-runtime "$RUNNER_TEMP/tuist")
          if [[ "${{ (inputs.feature_validation && matrix.lane != 'normal') }}" == "true" ]]; then args+=(--build-probe); fi
          check_native "${args[@]}"
          check_native python3 Tools/verify-feature-connection.py --output "$RUNNER_TEMP/feature-connection"
          check_native python3 Tools/verify-package-compatible-update.py --output "$RUNNER_TEMP/package-compatible-update"
          check_native python3 Tools/verify-incoming-processes.py
          check_native python3 Tools/verify-shared-state-processes.py
          check_native python3 -m unittest discover -s Tests/PackageCompatibleUpdate -p 'test_*.py'
          if [[ "${{ (inputs.feature_validation && matrix.lane != 'normal') }}" == "true" && -f Tools/verify-privacy-manifest-ownership.py ]]; then
            check_native python3 Tools/verify-privacy-manifest-ownership.py
          fi
          test "$failures" -eq 0

      - name: Measure backup memory in separate test processes
        if: ${{ matrix.lane != 'generated' && (!inputs.focused_ui_validation) }}
        run: |
          swift test --skip-build --filter LargeAttachmentBackupTests/testLargeAttachmentRoundTripWithoutWholeFileData
          swift test --skip-build --filter LargeAttachmentBackupTests/testLegacyPayloadMemoryBaseline

      - name: Test independent Feature packages
        if: ${{ matrix.lane != 'generated' && (!inputs.focused_ui_validation) }}
        run: python3 Tools/test-module-packages.py Modules

      - name: Build independent Records app
        if: (inputs.feature_validation && matrix.lane != 'normal') && inputs.records_validation
        shell: bash
        run: |
          set -euo pipefail
          tuist generate --path Modules/Records --no-open
          xcodebuild build -workspace Modules/Records/RecordsExample.xcworkspace -scheme RecordsExample \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RecordsDerivedData" CODE_SIGNING_ALLOWED=NO

      - name: Verify native Feature template
        id: feature-template
        if: (inputs.feature_validation && matrix.lane != 'normal')
        shell: bash
        env:
          PACKAGE_RESOURCES_VALIDATION: ${{ inputs.package_resources_validation }}
          FEATURE_UI_TEST_FILTER: ${{ inputs.feature_ui_test_filter }}
          P1_DEVICE_VALIDATION: ${{ inputs.p1_device_validation }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/template-check"
          mkdir -p "$smoke"
          git archive HEAD | tar -x -C "$smoke"
          cd "$smoke"
          tuist scaffold feature --name Notes
          python3 Tools/test-module-packages.py Modules
          tuist generate --path Modules/Notes --no-open
          xcodebuild build -workspace Modules/Notes/NotesExample.xcworkspace -scheme NotesExample \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/TemplateDerivedData" CODE_SIGNING_ALLOWED=NO
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          shutil.copyfile('Tests/TemplateIntegration/GeneratedFeatureUITests.swift', 'UITests/GeneratedFeatureUITests.swift')
          shutil.copyfile('Tests/TemplateIntegration/LifecycleProbeIntegration.swift', 'Sources/JibunKit/LifecycleProbeIntegration.swift')
          shutil.copyfile('Tests/TemplateIntegration/P0ALifetimeProbe.swift', 'Sources/JibunKit/P0ALifetimeProbe.swift')
          shutil.copyfile('Tests/TemplateIntegration/P0ALifetimeUITests.swift', 'UITests/P0ALifetimeUITests.swift')
          if 'P1IncomingUITests' in os.environ.get('FEATURE_UI_TEST_FILTER', '') or os.environ['P1_DEVICE_VALIDATION'] == 'true':
              shutil.copyfile('Tests/TemplateIntegration/P1IncomingProbe.swift', 'Sources/JibunKit/P1IncomingProbe.swift')
              shutil.copyfile('Tests/TemplateIntegration/P1IncomingUITests.swift', 'UITests/P1IncomingUITests.swift')
          if any(name in os.environ.get('FEATURE_UI_TEST_FILTER', '') for name in ('P0BPresentationUITests', 'P0COnboardingUITests')):
              shutil.copyfile('Tests/TemplateIntegration/P0BPresentationProbe.swift', 'Sources/JibunKit/P0BPresentationProbe.swift')
              shutil.copyfile('Tests/TemplateIntegration/P0BPresentationUITests.swift', 'UITests/P0BPresentationUITests.swift')
          if any(name in os.environ.get('FEATURE_UI_TEST_FILTER', '') for name in ('P0BManagementFailureUITests', 'P0COnboardingUITests')) or os.environ['P1_DEVICE_VALIDATION'] == 'true':
              shutil.copyfile('Tests/TemplateIntegration/P0BManagementFailureProbe.swift', 'Sources/JibunKit/P0BManagementFailureProbe.swift')
              shutil.copyfile('Tests/TemplateIntegration/P0BManagementFailureUITests.swift', 'UITests/P0BManagementFailureUITests.swift')
          shutil.copyfile('Tests/TemplateIntegration/P0ARecordsProbe.swift', 'Sources/JibunKit/P0ARecordsProbe.swift')
          shutil.copyfile('Tests/TemplateIntegration/P0ARecordsUITests.swift', 'UITests/P0ARecordsUITests.swift')
          shutil.copyfile('Tests/TemplateIntegration/P0ASQLiteProbe.swift', 'Sources/JibunKit/P0ASQLiteProbe.swift')
          shutil.copyfile('Tests/TemplateIntegration/P0ASQLiteUITests.swift', 'UITests/P0ASQLiteUITests.swift')
          shutil.copyfile('Tests/TemplateIntegration/HostLaunchHookProbe.swift', 'Sources/JibunKit/HostLaunchHookProbe.swift')
          shutil.copyfile('Tests/TemplateIntegration/HostLaunchHookUITests.swift', 'UITests/HostLaunchHookUITests.swift')
          shutil.copyfile('Tests/TemplateIntegration/NowPlayingOwnershipProbe.swift', 'Sources/JibunKit/NowPlayingOwnershipProbe.swift')
          shutil.copyfile('Tests/TemplateIntegration/NowPlayingOwnershipUITests.swift', 'UITests/NowPlayingOwnershipUITests.swift')
          shutil.copyfile('Tests/TemplateIntegration/NowPlayingPlayableProbe.swift', 'Sources/JibunKit/NowPlayingPlayableProbe.swift')
          shutil.copyfile('Tests/TemplateIntegration/NowPlayingPlayableUITests.swift', 'UITests/NowPlayingPlayableUITests.swift')
          shutil.copyfile('Modules/Records/Integration/RecordsMiniApp.swift', 'Sources/JibunKit/RecordsMiniApp.swift')
          shutil.copyfile('Modules/Records/Integration/RecordsBackup.swift', 'Sources/JibunKit/RecordsBackup.swift')
          shutil.copyfile('Modules/Records/Integration/RecordsNotifications.swift', 'Sources/JibunKit/RecordsNotifications.swift')
          keychain_probe = Path('Tests/TemplateIntegration/KeychainAccessControlProbe.swift')
          keychain_tests = Path('Tests/TemplateIntegration/KeychainAccessControlUITests.swift')
          if keychain_probe.exists() != keychain_tests.exists():
              raise SystemExit('Keychain access-control integration fixtures must be added together')
          include_keychain_probe = keychain_probe.exists()
          if include_keychain_probe:
              shutil.copyfile(keychain_probe, 'Sources/JibunKit/KeychainAccessControlProbe.swift')
              shutil.copyfile(keychain_tests, 'UITests/KeychainAccessControlUITests.swift')
          spotlight_probe = Path('Tests/TemplateIntegration/SpotlightOwnershipProbe.swift')
          spotlight_tests = Path('Tests/TemplateIntegration/SpotlightOwnershipUITests.swift')
          if spotlight_probe.exists() != spotlight_tests.exists():
              raise SystemExit('Spotlight ownership integration fixtures must be added together')
          include_spotlight_probe = spotlight_probe.exists()
          if include_spotlight_probe:
              shutil.copyfile(spotlight_probe, 'Sources/JibunKit/SpotlightOwnershipProbe.swift')
              shutil.copyfile(spotlight_tests, 'UITests/SpotlightOwnershipUITests.swift')
          spotlight_routing_probe = Path('Tests/TemplateIntegration/SpotlightRoutingProbe.swift')
          spotlight_routing_tests = Path('Tests/TemplateIntegration/SpotlightRoutingUITests.swift')
          if spotlight_routing_probe.exists() != spotlight_routing_tests.exists():
              raise SystemExit('Spotlight routing integration fixtures must be added together')
          include_spotlight_routing_probe = spotlight_routing_probe.exists()
          if include_spotlight_routing_probe:
              assert include_spotlight_probe, 'Spotlight routing probe reuses the native ownership query helper'
              shutil.copyfile(spotlight_routing_probe, 'Sources/JibunKit/SpotlightRoutingProbe.swift')
              shutil.copyfile(spotlight_routing_tests, 'UITests/SpotlightRoutingUITests.swift')
          web_storage_probe = Path('Tests/TemplateIntegration/WebStorageOwnershipProbe.swift')
          web_storage_tests = Path('Tests/TemplateIntegration/WebStorageOwnershipUITests.swift')
          if web_storage_probe.exists() != web_storage_tests.exists():
              raise SystemExit('Web storage ownership integration fixtures must be added together')
          include_web_storage_probe = web_storage_probe.exists()
          if include_web_storage_probe:
              shutil.copyfile(web_storage_probe, 'Sources/JibunKit/WebStorageOwnershipProbe.swift')
              shutil.copyfile(web_storage_tests, 'UITests/WebStorageOwnershipUITests.swift')
          background_probe = Path('Tests/TemplateIntegration/BackgroundExecutionProbe.swift')
          background_tests = Path('Tests/TemplateIntegration/BackgroundExecutionUITests.swift')
          if background_probe.exists() != background_tests.exists():
              raise SystemExit('Background execution integration fixtures must be added together')
          include_background_probe = background_probe.exists()
          if include_background_probe:
              shutil.copyfile(background_probe, 'Sources/JibunKit/BackgroundExecutionProbe.swift')
              shutil.copyfile(background_tests, 'UITests/BackgroundExecutionUITests.swift')
          url_probe = Path('Tests/TemplateIntegration/URLRoutingProbe.swift')
          url_tests = Path('Tests/TemplateIntegration/URLRoutingUITests.swift')
          url_build = Path('Tests/TemplateIntegration/URLRoutingBuildRequirements.swift.fixture')
          include_url_probe = url_probe.exists()
          assert len({url_probe.exists(), url_tests.exists(), url_build.exists()}) == 1, 'URL routing fixtures must be added together'
          if include_url_probe:
              shutil.copyfile(url_probe, 'Sources/JibunKit/URLRoutingProbe.swift')
              shutil.copyfile(url_tests, 'UITests/URLRoutingUITests.swift')
              shutil.copyfile(url_build, 'Tuist/ProjectDescriptionHelpers/EnabledFeatureBuildRequirements.swift')
          include_compatible_update = 'P0CCompatibleUpdateV1UITests' in os.environ.get('FEATURE_UI_TEST_FILTER', '')
          assert 'P0CCompatibleUpdateV2UITests' not in os.environ.get('FEATURE_UI_TEST_FILTER', ''), 'Select V1; the update step runs V2 after replacing only A'
          include_package_resources = os.environ['PACKAGE_RESOURCES_VALIDATION'] == 'true' or include_compatible_update
          resource_packages = 'Tests/PackageResources' if include_compatible_update else 'PackageResourceFixtures'
          if include_package_resources:
              if not include_compatible_update:
                  shutil.copytree('Tests/PackageResources/FeatureA', 'PackageResourceFixtures/FeatureA')
                  shutil.copytree('Tests/PackageResources/FeatureB', 'PackageResourceFixtures/FeatureB')
              shutil.copyfile('Tests/TemplateIntegration/PackageResourceHostProbe.swift', 'Sources/JibunKit/PackageResourceHostProbe.swift')
              shutil.copyfile('Tests/TemplateIntegration/PackageResourceHostUITests.swift', 'UITests/PackageResourceHostUITests.swift')
          p = Path('Project.swift')
          s = p.read_text().replace('packages: [.package(path: ".")]', 'packages: [.package(path: "."), .package(path: "Modules/Notes"), .package(path: "Modules/Records")]')
          if include_package_resources:
              s = s.replace('.package(path: "Modules/Records")]', f'.package(path: "Modules/Records"), .package(path: "{resource_packages}/FeatureA"), .package(path: "{resource_packages}/FeatureB")]')
          app_marker = 'name: "JibunKit-App", destinations:'
          assert s.count(app_marker) == 1, 'Expected exactly one host app target'
          before_app, marker, app_and_rest = s.partition(app_marker)
          dependency_marker = 'dependencies: [.package(product: "JibunKitCore")'
          assert dependency_marker in app_and_rest, 'Expected host Core dependency'
          injected_dependencies = ['.package(product: "RecordsFeature")', '.package(product: "NotesFeature")']
          if include_package_resources:
              injected_dependencies += ['.package(product: "ResourceFeatureA")', '.package(product: "ResourceFeatureB")']
          app_and_rest = app_and_rest.replace(
              dependency_marker,
              'dependencies: [' + ', '.join(injected_dependencies) + ', .package(product: "JibunKitCore")',
              1,
          )
          s = before_app + marker + app_and_rest
          p.write_text(s)
          p = Path('Sources/JibunKit/MiniAppRegistry.swift')
          p.write_text(p.read_text().replace('import JibunKitCore', 'import JibunKitCore\nimport NotesFeature').replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        MiniAppDefinition(id: MiniAppID("notes"), title: "Notes", systemImage: "book") { _ in NotesRootView() },'))
          p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        RecordsMiniApp.definition,'))
          if include_compatible_update:
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        P0CCompatibleUpdateProbe.definition,'))
          p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        LifecycleProbeIntegration.definitions[0],\n        LifecycleProbeIntegration.definitions[1],'))
          if 'P0COnboardingUITests' in os.environ.get('FEATURE_UI_TEST_FILTER', ''):
              shutil.copyfile('Tests/TemplateIntegration/P0COnboardingProbe.swift', 'Sources/JibunKit/P0COnboardingProbe.swift')
              shutil.copyfile('Tests/TemplateIntegration/P0COnboardingUITests.swift', 'UITests/P0COnboardingUITests.swift')
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        P0COnboardingProbe.definition,'))
              registry_check = '        precondition(\n            Set(miniApps.map(\\.id)).count == miniApps.count,'
              assert p.read_text().count(registry_check) == 1, 'Expected exactly one Registry validation'
              p.write_text(p.read_text().replace(registry_check, '        let miniApps = P0COnboardingProbe.registrations(miniApps)\n' + registry_check))
          if any(name in os.environ.get('FEATURE_UI_TEST_FILTER', '') for name in ('P0ASQLiteUITests', 'P0COnboardingUITests')):
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        P0ASQLiteProbe.definition,'))
          if any(name in os.environ.get('FEATURE_UI_TEST_FILTER', '') for name in ('P0ARecordsUITests', 'P0COnboardingUITests')):
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        P0ARecordsProbe.definition,'))
          if any(name in os.environ.get('FEATURE_UI_TEST_FILTER', '') for name in ('P0ALifetimeUITests', 'P0COnboardingUITests')):
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        P0ALifetimeProbe.definitions[0],\n        P0ALifetimeProbe.definitions[1],'))
          if include_keychain_probe:
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        KeychainAccessControlProbe.definition,'))
          if include_spotlight_probe:
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        SpotlightOwnershipProbe.definition,'))
          if include_spotlight_routing_probe:
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        SpotlightRoutingProbe.definitions[0],\n        SpotlightRoutingProbe.definitions[1],'))
          if include_web_storage_probe:
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        WebStorageOwnershipProbe.ownerADefinition,\n        WebStorageOwnershipProbe.ownerBDefinition,'))
          if include_background_probe:
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        BackgroundExecutionProbe.definition,'))
          if include_url_probe:
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        URLRoutingProbe.definitions[0],\n        URLRoutingProbe.definitions[1],'))
          if include_package_resources:
              registry_end = '        ReminderMiniApp.definition,\n    ])'
              assert p.read_text().count(registry_end) == 1, 'Expected exactly one host registry end'
              p.write_text(p.read_text().replace(
                  registry_end,
                  '        ReminderMiniApp.definition,\n        PackageResourceHostProbe.definition,\n    ])',
              ))
          p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        HostLaunchHookProbe.definitions[0],\n        HostLaunchHookProbe.definitions[1],'))
          if 'P1IncomingUITests' in os.environ.get('FEATURE_UI_TEST_FILTER', '') or os.environ['P1_DEVICE_VALIDATION'] == 'true':
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        P1IncomingProbe.definitions[0],\n        P1IncomingProbe.definitions[1],'))
          p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        NowPlayingOwnershipProbe.definition,'))
          p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        NowPlayingPlayableProbe.definition,'))
          if any(name in os.environ.get('FEATURE_UI_TEST_FILTER', '') for name in ('P0BManagementFailureUITests', 'P0COnboardingUITests')) or os.environ['P1_DEVICE_VALIDATION'] == 'true':
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        P0BManagementFailureProbe.definition,'))
          # Keep the focused presentation pair visible in both the launcher and
          # switch menu while retaining every other coexistence registration.
          if any(name in os.environ.get('FEATURE_UI_TEST_FILTER', '') for name in ('P0BPresentationUITests', 'P0COnboardingUITests')):
              p.write_text(p.read_text().replace('static let all = makeRegistry([', 'static let all = makeRegistry([\n        P0BPresentationProbe.definitions[0],\n        P0BPresentationProbe.definitions[1],'))
          PY
          if [[ "$FEATURE_UI_TEST_FILTER" == *P1IntentsUITests* || "$P1_DEVICE_VALIDATION" == true ]]; then
            python3 Tools/prepare-p1-intents-host.py --host "$smoke"
          fi
          if [[ "$FEATURE_UI_TEST_FILTER" == *P1WidgetsUITests* || "$FEATURE_UI_TEST_FILTER" == *P1WidgetGalleryUITests* || "$P1_DEVICE_VALIDATION" == true ]]; then
            python3 Tools/prepare-p1-widgets-host.py --host "$smoke"
          fi
          if [[ "$P1_DEVICE_VALIDATION" == true ]]; then
            python3 Tools/prepare-p1-b-host.py --host "$smoke" --all-lanes
          elif [[ "$FEATURE_UI_TEST_FILTER" == *P1NotificationsUITests* || "$FEATURE_UI_TEST_FILTER" == *P1HTTPUITests* || "$FEATURE_UI_TEST_FILTER" == *P1WebUITests* ]]; then
            python3 Tools/prepare-p1-b-host.py --host "$smoke" --ui-test-filter "$FEATURE_UI_TEST_FILTER"
          fi
          if [[ "$FEATURE_UI_TEST_FILTER" == *P0CCompatibleUpdateV1UITests* ]]; then
            python3 "$GITHUB_WORKSPACE/Tools/prepare-package-compatible-update-host.py" --host "$smoke" --stage v1
            for owner in A B; do
              python3 Tools/check-feature-connection.py --package "Tests/PackageResources/Feature$owner" --product "ResourceFeature$owner"
            done
          fi
          python3 Tools/check-feature-connection.py --package Modules/Notes --product NotesFeature
          tuist generate --no-open
          xcodebuild build -workspace JibunKit.xcworkspace -scheme JibunKit-App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/TemplateHostDerivedData" CODE_SIGNING_ALLOWED=NO
          host_app="$RUNNER_TEMP/TemplateHostDerivedData/Build/Products/Release-iphoneos/JibunKit_App.app"
          host_widget="$host_app/PlugIns/JibunKitWidget_Extension.appex"
          if [[ "$FEATURE_UI_TEST_FILTER" == *P1IntentsUITests* || "$P1_DEVICE_VALIDATION" == true ]]; then
            test -f "$host_app/Metadata.appintents/extract.actionsdata"
            cp -R "$host_app/Metadata.appintents" "$RUNNER_TEMP/P1IntentsHostMetadata"
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleAllowMixedLocalizations' "$host_app/Info.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleAllowMixedLocalizations' "$host_widget/Info.plist")" = true

      - name: Generate Xcode workspace
        if: matrix.lane != 'generated'
        run: |
          set -euo pipefail
          tuist generate --no-open
          xcodebuild -workspace JibunKit.xcworkspace -list

      - name: Build with Xcode
        if: ${{ matrix.lane != 'generated' && (!inputs.focused_ui_validation) }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace JibunKit.xcworkspace \
            -scheme JibunKit-App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify, ad-hoc sign, and package IPA
        if: ${{ matrix.lane != 'generated' && (!inputs.focused_ui_validation) }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JibunKit_App.app"
          widget="$app/PlugIns/JibunKitWidget_Extension.appex"
          metadata="$app/Metadata.appintents/extract.actionsdata"

          require_executable() {
            local label="$1" path="$2"
            printf '%s: %s\n' "$label" "$path"
            if [[ ! -x "$path" ]]; then
              echo "error: $label is missing or not executable" >&2
              return 1
            fi
          }

          require_nonempty() {
            local label="$1" path="$2"
            printf '%s: %s\n' "$label" "$path"
            if [[ ! -s "$path" ]]; then
              echo "error: $label is missing or empty" >&2
              return 1
            fi
          }

          require_contains() {
            local label="$1" actual="$2" expected="$3"
            printf '%s: %s\n' "$label" "$actual"
            if [[ "$actual" != *"$expected"* ]]; then
              echo "error: $label does not contain $expected" >&2
              return 1
            fi
          }

          require_equal() {
            local label="$1" actual="$2" expected="$3"
            printf '%s: actual=%q expected=%q\n' "$label" "$actual" "$expected"
            if [[ "$actual" != "$expected" ]]; then
              echo "error: $label does not match" >&2
              return 1
            fi
          }

          plist_value() {
            /usr/libexec/PlistBuddy -c "Print :$2" "$1"
          }

          app_executable="$(plist_value "$app/Info.plist" CFBundleExecutable)"
          widget_executable="$(plist_value "$widget/Info.plist" CFBundleExecutable)"
          require_executable "app executable" "$app/$app_executable"
          require_executable "widget executable" "$widget/$widget_executable"
          require_nonempty "App Intents metadata" "$metadata"
          cp "$metadata" "$RUNNER_TEMP/host-app-intents.json"
          python3 -m unittest discover -s Tools/tests -p test_host_shortcut_compatibility.py
          python3 Tools/verify-host-shortcut-compatibility.py "$metadata"

          app_architecture="$(file "$app/$app_executable")"
          widget_architecture="$(file "$widget/$widget_executable")"
          require_contains "app architecture" "$app_architecture" "arm64"
          require_contains "widget architecture" "$widget_architecture" "arm64"

          require_equal "app bundle identifier" \
            "$(plist_value "$app/Info.plist" CFBundleIdentifier)" \
            "com.jibunkit.app"
          require_equal "widget bundle identifier" \
            "$(plist_value "$widget/Info.plist" CFBundleIdentifier)" \
            "com.jibunkit.app.Widget"
          require_equal "app short version" \
            "$(plist_value "$app/Info.plist" CFBundleShortVersionString)" \
            "1.0.0"
          require_equal "app build version" \
            "$(plist_value "$app/Info.plist" CFBundleVersion)" \
            "16"
          require_equal "widget short version" \
            "$(plist_value "$widget/Info.plist" CFBundleShortVersionString)" \
            "$(plist_value "$app/Info.plist" CFBundleShortVersionString)"
          require_equal "widget build version" \
            "$(plist_value "$widget/Info.plist" CFBundleVersion)" \
            "$(plist_value "$app/Info.plist" CFBundleVersion)"
          require_equal "app mixed localizations" \
            "$(plist_value "$app/Info.plist" CFBundleAllowMixedLocalizations)" \
            "true"
          require_equal "widget mixed localizations" \
            "$(plist_value "$widget/Info.plist" CFBundleAllowMixedLocalizations)" \
            "true"
          python3 Tools/verify-localized-info-plist.py GeneratedFeatureResources/App "$app"
          python3 Tools/verify-localized-info-plist.py GeneratedFeatureResources/Widget "$widget"

          widget_entitlements_file="$(find Derived -type f -name 'JibunKitWidget-Extension.entitlements')"
          app_entitlements_file="$(find Derived -type f -name 'JibunKit-App.entitlements')"
          test -f "$widget_entitlements_file"
          test -f "$app_entitlements_file"
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements "$widget_entitlements_file" "$widget"
          python3 Tools/verify-share-extension.py --app "$app" --entitlements-root Derived
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements "$app_entitlements_file" "$app"
          codesign --verify --deep --strict "$app"
          app_entitlements="$(codesign --display --entitlements :- "$app" 2>&1)"
          widget_entitlements="$(codesign --display --entitlements :- "$widget" 2>&1)"
          require_contains "app entitlements" "$app_entitlements" \
            "group.com.jibunkit.shared"
          require_contains "widget entitlements" "$widget_entitlements" \
            "group.com.jibunkit.shared"

          mkdir -p artifacts "$RUNNER_TEMP/JibunKit-ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/JibunKit-ipa/Payload/JibunKit.app"
          (
            cd "$RUNNER_TEMP/JibunKit-ipa"
            ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/artifacts/JibunKit.ipa"
          )
          unzip -t artifacts/JibunKit.ipa
          shasum --algorithm 256 artifacts/JibunKit.ipa

      - name: Upload IPA
        if: ${{ matrix.lane != 'generated' && (!inputs.focused_ui_validation) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: JibunKit-ad-hoc${{ env.EVIDENCE_SUFFIX }}
          path: artifacts/JibunKit.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Prepare simulator tests
        id: simulator-prepare
        if: inputs.simulator_tests
        env:
          REQUESTED_RUNTIME: ${{ inputs.simulator_runtime }}
          UI_TEST_FILTER: ${{ inputs.ui_test_filter }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          sim_id="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, os, sys
          devices = json.load(open(sys.argv[1]))['devices']
          runtimes = [runtime for runtime in devices if 'iOS-26' in runtime]
          requested = os.environ.get('REQUESTED_RUNTIME', '')
          if requested:
              runtimes = [runtime for runtime in runtimes if runtime.endswith('iOS-' + requested.replace('.', '-'))]
          if not runtimes:
              raise SystemExit('Requested iOS simulator runtime is not installed')
          runtime = max(runtimes, key=lambda value: tuple(map(int, value.split('iOS-')[1].split('-'))))
          candidates = [d for d in devices[runtime]
                        if d['name'].startswith('iPhone') and d['isAvailable']]
          if not candidates:
              raise SystemExit('No available iOS 26 iPhone simulator')
          candidates.sort(key=lambda d: (d['name'] != 'iPhone 16e', d['name']))
          print(candidates[0]['udid'])
          PY
          )"
          if [[ "$UI_TEST_FILTER" == "MigrationUITests/MigrationUITests/testBackupRoundTripRestoresOnlySelectedCounter" ]]; then
            # Isolate the FileProvider bookmark failure in the runner's precreated
            # device. Do not erase or mutate that device, or bypass Files import.
            read -r device_type runtime < <(python3 - "$RUNNER_TEMP/simulators.json" "$sim_id" <<'PYDEVICE'
          import json, sys
          devices = json.load(open(sys.argv[1]))['devices']
          for runtime, candidates in devices.items():
              for device in candidates:
                  if device['udid'] == sys.argv[2]:
                      print(device['deviceTypeIdentifier'], runtime)
                      raise SystemExit(0)
          raise SystemExit('Selected simulator missing')
          PYDEVICE
            )
            sim_id="$(xcrun simctl create "Backup-Files-${GITHUB_RUN_ID}" "$device_type" "$runtime")"
            echo "Fresh Files comparison device: $sim_id runtime=$runtime type=$device_type"
          fi
          echo "SIMULATOR_ID=$sim_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$sim_id"
          xcrun simctl bootstatus "$sim_id" -b

      - name: Verify native background URLSession ownership
        if: ${{ matrix.lane != 'generated' && (inputs.simulator_tests && inputs.background_urlsession_validation) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/verify-background-urlsession-native.py --simulator-id "$SIMULATOR_ID" \
            2>&1 | tee "$RUNNER_TEMP/background-urlsession-native.log"

      - name: Verify native BackgroundTasks pending ownership
        if: ${{ matrix.lane != 'generated' && (inputs.simulator_tests && inputs.backgroundtasks_validation) }}
        shell: bash
        run: |
          set -euo pipefail
          command=(python3 Tools/verify-backgroundtasks-native.py --simulator-id "$SIMULATOR_ID")
          if [[ "${{ inputs.backgroundtasks_compile_only }}" == "true" ]]; then
            command+=(--build-only)
          fi
          "${command[@]}" \
            2>&1 | tee "$RUNNER_TEMP/backgroundtasks-native.log"

      - name: Verify package resources and localization
        if: ${{ matrix.lane != 'generated' && (inputs.simulator_tests && inputs.package_resources_validation) }}
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/package-resource-check"
          derived="$RUNNER_TEMP/PackageResourceDerivedData"

          run_probe() {
            local mode="$1"
            local label="$2"
            python3 Tools/prepare-package-resource-probe.py --mode "$mode" --output "$probe"
            tuist generate --path "$probe" --no-open
            rm -rf "$RUNNER_TEMP/PackageResource-$label.xcresult"
            xcodebuild test -workspace "$probe/PackageResourceProbe.xcworkspace" -scheme PackageResourceProbe \
              -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath "$derived" -resultBundlePath "$RUNNER_TEMP/PackageResource-$label.xcresult" \
              -only-testing:PackageResourceUITests/PackageResourceUITests/testConfiguredPackageReadsOwnResources \
              -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
              2>&1 | tee "$RUNNER_TEMP/package-resource-$label.log"
          }

          run_probe a a-only
          run_probe b b-only
          run_probe combined combined
          stale_before="$(find "$derived" -type d -name '*ResourceFeatureA*.bundle' | wc -l | tr -d ' ')"
          run_probe b b-after-a-removal
          stale_after="$(find "$derived" -type d -name '*ResourceFeatureA*.bundle' | wc -l | tr -d ' ')"
          echo "PACKAGE_RESOURCE_STALE_A_BUNDLES before=$stale_before after=$stale_after"

      - name: Build and install standalone Counter
        id: standalone-counter
        if: ${{ matrix.lane != 'generated' && (inputs.simulator_tests && (!inputs.focused_ui_validation || inputs.ui_test_filter == 'MigrationUITests/MigrationUITests/testStandaloneCounterUsesIndependentStorage')) }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -workspace JibunKit.xcworkspace -scheme CounterExample \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SimulatorDerivedData" CODE_SIGNING_ALLOWED=NO
          xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/CounterExample.app"

      - name: Test generated standalone Feature
        if: inputs.simulator_tests && (inputs.feature_validation && matrix.lane != 'normal') && !inputs.generated_validation_only
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -workspace "$RUNNER_TEMP/template-check/Modules/Notes/NotesExample.xcworkspace" -scheme NotesExample \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TemplateSimulatorDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TemplateLaunch.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/template-launch.log"

      - name: Install normal Widget host before diagnostic update
        if: inputs.feature_validation && matrix.lane != 'normal' && contains(inputs.feature_ui_test_filter, 'P1WidgetGalleryUITests') && matrix.ui_shard != 'network'
        shell: bash
        run: |
          set -euo pipefail
          # Observe the normal host through its existing UI before replacement;
          # process launch alone is not evidence of a usable baseline.
          tuist generate --no-open
          xcodebuild test -workspace JibunKit.xcworkspace -scheme MigrationUITests \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/NormalBeforeP1Update" \
            -resultBundlePath "$RUNNER_TEMP/NormalBeforeP1Update.xcresult" \
            -only-testing:MigrationUITests/MigrationUITests/testMiniAppLinksOpenColdAndSwitchWarm \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual 2>&1 | tee "$RUNNER_TEMP/normal-before-p1-update.log"
          python3 Tools/validate-focused-ui-test.py MigrationUITests/MigrationUITests/testMiniAppLinksOpenColdAndSwitchWarm \
            --source-root UITests --log "$RUNNER_TEMP/normal-before-p1-update.log"

      - name: Test generated Feature in host
        id: generated-integration
        if: inputs.simulator_tests && (inputs.feature_validation && matrix.lane != 'normal')
        env:
          FEATURE_UI_TEST_FILTER: ${{ inputs.feature_ui_test_filter }}
          UI_SHARD: ${{ matrix.ui_shard }}
          P1_DEVICE_VALIDATION: ${{ inputs.p1_device_validation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$UI_SHARD" != all ]]; then
            FEATURE_UI_TEST_FILTER="$(python3 Tools/split-generated-ui.py --filter "$FEATURE_UI_TEST_FILTER" --shard "$UI_SHARD")"
          fi
          IFS=',' read -r -a feature_filters <<< "${FEATURE_UI_TEST_FILTER:-MigrationUITests/GeneratedFeatureUITests}"
          selection=()
          for feature_filter in "${feature_filters[@]}"; do
            selection+=("-only-testing:$feature_filter")
          done
          # macOS Bash 3.2 treats an empty array as unset under nounset.
          # env forwards the command unchanged and keeps both paths nonempty.
          fixture=(env)
          if [[ "$P1_DEVICE_VALIDATION" == true ]]; then
            export TEST_RUNNER_JIBUNKIT_USE_DEVICE_HTTP_FIXTURE=1
          elif [[ "$FEATURE_UI_TEST_FILTER" == *P1HTTPUITests* ]]; then
            fixture=(python3 Tests/Fixtures/network_server.py --run-command)
          fi
          "${fixture[@]}" xcodebuild test -workspace "$RUNNER_TEMP/template-check/JibunKit.xcworkspace" -scheme MigrationUITests \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TemplateHostSimulatorDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TemplateHost.xcresult" \
            "${selection[@]}" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual 2>&1 | tee "$RUNNER_TEMP/template-host.log"
          for feature_filter in "${feature_filters[@]}"; do
            python3 Tools/validate-focused-ui-test.py "$feature_filter" --allow-suite \
              --source-root "$RUNNER_TEMP/template-check/UITests" --log "$RUNNER_TEMP/template-host.log"
          done

      - name: Verify A-only package update in the same installed host
        if: inputs.simulator_tests && (inputs.feature_validation && matrix.lane != 'normal') && contains(inputs.feature_ui_test_filter, 'P0CCompatibleUpdateV1UITests')
        shell: bash
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/template-check"
          evidence="$RUNNER_TEMP/package-compatible-update-ios"
          mkdir -p "$evidence/v1" "$evidence/v2"
          container="$(xcrun simctl get_app_container "$SIMULATOR_ID" com.jibunkit.app data)"
          cp "$container/Documents/p0-c-compatible-update/feature-a.json" "$evidence/v1/"
          cp "$container/Documents/p0-c-compatible-update/feature-b.json" "$evidence/v1/"
          cp "$host/.p0c-compatible-update-v1.json" "$evidence/source-invariants.json"
          python3 Tools/prepare-package-compatible-update-host.py --host "$host" --stage v2 \
            2>&1 | tee "$evidence/prepare-v2.log"
          tuist generate --path "$host" --no-open
          selector=MigrationUITests/P0CCompatibleUpdateV2UITests/testReadUpdateRelaunchRejectCorruptionAndRepairWithoutReseeding
          # The second test build installs over the same bundle; never erase or uninstall.
          xcodebuild test -workspace "$host/JibunKit.xcworkspace" -scheme MigrationUITests \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TemplateHostSimulatorDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TemplateHostUpdate.xcresult" \
            "-only-testing:$selector" -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            2>&1 | tee "$evidence/update-host.log"
          python3 Tools/validate-focused-ui-test.py "$selector" \
            --source-root "$host/UITests" --log "$evidence/update-host.log"
          container="$(xcrun simctl get_app_container "$SIMULATOR_ID" com.jibunkit.app data)"
          cp "$container/Documents/p0-c-compatible-update/feature-a.json" "$evidence/v2/"
          cp "$container/Documents/p0-c-compatible-update/feature-b.json" "$evidence/v2/"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'package-compatible-update-ios'
          assert json.loads((root / 'v1/feature-a.json').read_text()) == {'name': 'alpha'}
          assert json.loads((root / 'v2/feature-a.json').read_text()) == {'name': 'alpha', 'note': 'added by v2', 'priority': 2}
          assert (root / 'v1/feature-b.json').read_bytes() == (root / 'v2/feature-b.json').read_bytes() == b'{"count":7}'
          (root / 'result.json').write_text(json.dumps({'result': 'passed', 'a': 'v1-to-v2-repaired', 'b': 'exact-bytes-preserved'}) + '\n')
          PY

      - name: Build and install backup UI harness
        id: backup-harness
        if: ${{ matrix.lane != 'generated' && (!cancelled() && inputs.simulator_tests && steps.simulator-prepare.outcome == 'success' && (!inputs.focused_ui_validation || startsWith(inputs.ui_test_filter, 'MigrationUITests/BackupRestoreUITests/'))) }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -workspace JibunKit.xcworkspace -scheme BackupHarness \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SimulatorDerivedData" CODE_SIGNING_ALLOWED=NO
          xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/BackupHarness.app"

      - name: Run simulator integration checks
        id: integration
        # A generated-host failure must not suppress the independent normal host.
        # Focused tests may intentionally omit Counter or the backup harness;
        # a failed prerequisite is never treated as an intentional skip.
        if: ${{ matrix.lane != 'generated' && (!cancelled() && inputs.simulator_tests && steps.simulator-prepare.outcome == 'success' && (steps.standalone-counter.outcome == 'success' || (inputs.focused_ui_validation && steps.standalone-counter.outcome == 'skipped')) && (steps.backup-harness.outcome == 'success' || (inputs.focused_ui_validation && steps.backup-harness.outcome == 'skipped'))) }}
        shell: bash
        env:
          UI_TEST_FILTER: ${{ inputs.ui_test_filter }}
        run: |
          set -euo pipefail
          selection=(-skip-testing:MigrationUITests/MigrationUITests/testBackupRoundTripRestoresOnlySelectedCounter)
          if [[ -n "$UI_TEST_FILTER" ]]; then
            selection=("-only-testing:$UI_TEST_FILTER")
          fi
          xcodebuild test \
            -workspace JibunKit.xcworkspace \
            -scheme MigrationUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SimulatorDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Migration.xcresult" \
            "${selection[@]}" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/simulator-tests.log"
          if [[ -n "$UI_TEST_FILTER" ]]; then
            python3 Tools/validate-focused-ui-test.py "$UI_TEST_FILTER" \
              --allow-suite --log "$RUNNER_TEMP/simulator-tests.log"
          fi

      - name: Run Files backup round trip
        if: ${{ matrix.lane != 'generated' && (!cancelled() && inputs.simulator_tests && inputs.ui_test_filter == '' && (steps.integration.outcome == 'success' || steps.integration.outcome == 'failure')) }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -workspace JibunKit.xcworkspace \
            -scheme MigrationUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SimulatorDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/FilesRoundTrip.xcresult" \
            -only-testing:MigrationUITests/MigrationUITests/testBackupRoundTripRestoresOnlySelectedCounter \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/files-round-trip.log"

      - name: Test Records editing and persistence
        if: ${{ !cancelled() && inputs.simulator_tests && inputs.records_validation && (inputs.feature_validation && matrix.lane != 'normal') && steps.feature-template.outcome == 'success' && steps.simulator-prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -workspace Modules/Records/RecordsExample.xcworkspace -scheme RecordsExample \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/RecordsSimulatorDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Records.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual 2>&1 | tee "$RUNNER_TEMP/records-ui.log"

      - name: Package candidate diagnostic IPA
        if: (inputs.feature_validation && matrix.lane != 'normal') && (contains(inputs.feature_ui_test_filter, 'P0COnboardingUITests') || (inputs.p1_device_validation && matrix.ui_shard != 'web-management'))
        env:
          CANDIDATE_KIND: ${{ inputs.p1_device_validation && 'P1' || 'P0' }}
        shell: bash
        run: |
          set -euxo pipefail
          derived="$RUNNER_TEMP/TemplateHostDerivedData"
          app="$derived/Build/Products/Release-iphoneos/JibunKit_App.app"
          widget="$app/PlugIns/JibunKitWidget_Extension.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.jibunkit.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 1.0.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 15
          entitlements_root="$RUNNER_TEMP/template-check/Derived"
          app_entitlements="$(find "$entitlements_root" -type f -name 'JibunKit-App.entitlements')"
          widget_entitlements="$(find "$entitlements_root" -type f -name 'JibunKitWidget-Extension.entitlements')"
          for entitlement in "$app_entitlements" "$widget_entitlements"; do
            if [[ ! -f "$entitlement" ]]; then
              echo "Expected exactly one Tuist entitlement file under $entitlements_root; got: $entitlement" >&2
              exit 1
            fi
          done
          codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements "$widget_entitlements" "$widget"
          python3 Tools/verify-share-extension.py --app "$app" --entitlements-root "$entitlements_root"
          codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements "$app_entitlements" "$app"
          codesign --verify --deep --strict "$app"
          package="$RUNNER_TEMP/P0CandidateIPA"
          mkdir -p "$package/Payload" artifacts
          ditto "$app" "$package/Payload/JibunKit.app"
          ipa="$GITHUB_WORKSPACE/artifacts/JibunKit-$CANDIDATE_KIND-check.ipa"
          (cd "$package" && ditto -c -k --sequesterRsrc --keepParent Payload "$ipa")
          unzip -t "$ipa"
          shasum --algorithm 256 "$ipa"
          if [[ "$CANDIDATE_KIND" == P1 ]]; then
            python3 Tools/verify-p1-device-ipa.py "$ipa" --version 1.0.0 --build 16 \
              --output artifacts/P1-device-inventory.json
          fi

      - name: Upload candidate diagnostic IPA
        if: (inputs.feature_validation && matrix.lane != 'normal') && (contains(inputs.feature_ui_test_filter, 'P0COnboardingUITests') || (inputs.p1_device_validation && matrix.ui_shard != 'web-management'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: JibunKit-${{ inputs.p1_device_validation && 'P1' || 'P0' }}-device-check${{ env.EVIDENCE_SUFFIX }}
          path: |
            artifacts/JibunKit-${{ inputs.p1_device_validation && 'P1' || 'P0' }}-check.ipa
            artifacts/P1-device-inventory.json
          retention-days: 14

      - name: Export simulator screenshots
        if: always() && inputs.simulator_tests
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/Records.xcresult" ]]; then
            if [[ -n "${SIMULATOR_ID:-}" ]]; then
              records_container="$(xcrun simctl get_app_container "$SIMULATOR_ID" com.jibunkit.example.records data)"
              if [[ -f "$records_container/Library/Application Support/Records/records.json" ]]; then
                cp "$records_container/Library/Application Support/Records/records.json" "$RUNNER_TEMP/records-test-index.json"
              fi
            fi
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Records.xcresult" --output-path "$RUNNER_TEMP/records-screenshots"
            xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/Records.xcresult" --output-path "$RUNNER_TEMP/records-diagnostics"
          fi
          if [[ -d "$RUNNER_TEMP/Migration.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/Migration.xcresult" \
              --output-path "$RUNNER_TEMP/simulator-screenshots"
            xcrun xcresulttool export diagnostics \
              --path "$RUNNER_TEMP/Migration.xcresult" \
              --output-path "$RUNNER_TEMP/simulator-diagnostics"
          fi
          if [[ -d "$RUNNER_TEMP/TemplateHost.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/TemplateHost.xcresult" \
              --output-path "$RUNNER_TEMP/template-host-screenshots"
          fi
          if [[ -d "$RUNNER_TEMP/FilesRoundTrip.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/FilesRoundTrip.xcresult" \
              --output-path "$RUNNER_TEMP/files-screenshots"
            xcrun xcresulttool export diagnostics \
              --path "$RUNNER_TEMP/FilesRoundTrip.xcresult" \
              --output-path "$RUNNER_TEMP/files-diagnostics"
          fi
          mkdir -p "$RUNNER_TEMP/simulator-crashes"
          find "$HOME/Library/Logs/DiagnosticReports" -type f -name '*JibunKit*' \
            -exec cp {} "$RUNNER_TEMP/simulator-crashes/" \; || true
          if [[ -n "${SIMULATOR_ID:-}" ]]; then
            xcrun simctl spawn "$SIMULATOR_ID" log show --last 20m --info --style compact \
              --predicate 'process == "JibunKit_App" OR process == "RecordsExample" OR process == "BackupHarness" OR process CONTAINS[c] "DocumentManager" OR subsystem CONTAINS[c] "DocumentManager" OR process == "fileproviderd" OR process == "SpringBoard" OR process == "usernotificationsd" OR process == "runningboardd"' \
              > "$RUNNER_TEMP/simulator-app.log" || true
          fi

      - name: Upload simulator text diagnostics
        if: always() && inputs.simulator_tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Simulator-text-diagnostics${{ env.EVIDENCE_SUFFIX }}
          path: |
            ${{ runner.temp }}/simulator-tests.log
            ${{ runner.temp }}/simulator-app.log
          retention-days: 14

      - name: Upload build requirement diagnostics
        if: always() && !inputs.focused_ui_validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Feature-build-requirement-diagnostics${{ env.EVIDENCE_SUFFIX }}
          path: |
            ${{ runner.temp }}/feature-build-requirements.log
            ${{ runner.temp }}/feature-connection/
            ${{ runner.temp }}/package-compatible-update/result.json
            ${{ runner.temp }}/package-compatible-update/logs/
            ${{ runner.temp }}/package-compatible-update/store/
            ${{ runner.temp }}/package-compatible-update/SourceSnapshots/
            ${{ runner.temp }}/package-compatible-update/Packages/
            ${{ runner.temp }}/package-compatible-update/Runner/Package.swift
            ${{ runner.temp }}/package-compatible-update/Runner/Sources/
            ${{ runner.temp }}/host-app-intents.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload background URLSession diagnostics
        if: ${{ matrix.lane != 'generated' && (always() && inputs.simulator_tests && inputs.background_urlsession_validation) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Background-URLSession-diagnostics${{ env.EVIDENCE_SUFFIX }}
          path: |
            ${{ runner.temp }}/background-urlsession-native.log
            ${{ runner.temp }}/BackgroundURLSessionNative.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload BackgroundTasks diagnostics
        if: ${{ matrix.lane != 'generated' && (always() && inputs.simulator_tests && inputs.backgroundtasks_validation) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BackgroundTasks-diagnostics${{ env.EVIDENCE_SUFFIX }}
          path: |
            ${{ runner.temp }}/backgroundtasks-native.log
            ${{ runner.temp }}/BackgroundTasksNative.xcresult
            ${{ runner.temp }}/SharedRefresh.xcresult
            ${{ runner.temp }}/shared-refresh-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backup picker diagnostics
        if: ${{ matrix.lane != 'generated' && (always() && inputs.simulator_tests) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Backup-picker-diagnostics${{ env.EVIDENCE_SUFFIX }}
          path: |
            ${{ runner.temp }}/simulator-screenshots/*.png
            ${{ runner.temp }}/simulator-screenshots/*.txt
            ${{ runner.temp }}/simulator-screenshots/manifest.json
            ${{ runner.temp }}/files-screenshots/*.png
            ${{ runner.temp }}/files-screenshots/*.txt
            ${{ runner.temp }}/files-screenshots/manifest.json
          retention-days: 7

      - name: Upload focused Records diagnostics
        if: always() && inputs.simulator_tests && (inputs.feature_validation && matrix.lane != 'normal')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Records-focused-diagnostics${{ env.EVIDENCE_SUFFIX }}
          path: |
            ${{ runner.temp }}/records-ui.log
            ${{ runner.temp }}/records-test-index.json
            ${{ runner.temp }}/records-screenshots
            ${{ runner.temp }}/simulator-app.log
          retention-days: 7

      - name: Upload simulator evidence
        if: always() && inputs.simulator_tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: JibunKit-simulator-evidence${{ env.EVIDENCE_SUFFIX }}
          path: |
            ${{ runner.temp }}/records-screenshots
            ${{ runner.temp }}/records-diagnostics
            ${{ runner.temp }}/records-test-index.json
            ${{ runner.temp }}/Migration.xcresult
            ${{ runner.temp }}/Records.xcresult
            ${{ runner.temp }}/records-ui.log
            ${{ runner.temp }}/TemplateLaunch.xcresult
            ${{ runner.temp }}/TemplateHost.xcresult
            ${{ runner.temp }}/P1IntentsHostMetadata
            ${{ runner.temp }}/TemplateHostUpdate.xcresult
            ${{ runner.temp }}/package-compatible-update-ios/
            ${{ runner.temp }}/template-host-screenshots
            ${{ runner.temp }}/template-host.log
            ${{ runner.temp }}/normal-before-p1-update.log
            ${{ runner.temp }}/NormalBeforeP1Update.xcresult
            ${{ runner.temp }}/template-launch.log
            ${{ runner.temp }}/FilesRoundTrip.xcresult
            ${{ runner.temp }}/files-screenshots
            ${{ runner.temp }}/files-diagnostics
            ${{ runner.temp }}/files-round-trip.log
            ${{ runner.temp }}/simulator-screenshots
            ${{ runner.temp }}/simulator-diagnostics
            ${{ runner.temp }}/simulator-crashes
            ${{ runner.temp }}/simulator-app.log
            ${{ runner.temp }}/simulator-tests.log
            ${{ runner.temp }}/simulators.json
          retention-days: 7
