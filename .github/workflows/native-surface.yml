name: Native package surface

on:
  workflow_dispatch:
    inputs:
      surface:
        required: true
        type: choice
        options: [spotlight-cold-start, p1-input-repair, incoming-os, incoming-repair, interactive-widgets, continuing-surfaces, continuing-live-host, continuing-state, media, background-location, location-cold, identity-push, ble-scenes, ar-action, p2-combined]
      ios_major:
        description: Target OS major for native comparison; 27 uses the preview Xcode image
        type: choice
        options: ['26', '27']
        default: '26'
      simulator_runtime:
        default: ''
        type: string
  workflow_call:
    inputs:
      surface:
        required: true
        type: string
      ios_major:
        type: string
        default: '26'
      simulator_runtime:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.surface }} (iOS ${{ inputs.ios_major }})
    strategy:
      fail-fast: false
      matrix:
        # One device-followup boundary; independent builds finish/report once.
        surface: ${{ fromJSON(inputs.surface == 'continuing-surfaces' && '["continuing-live","continuing-alarm","continuing-host"]' || inputs.surface == 'continuing-live-host' && '["continuing-live","continuing-host"]' || inputs.surface == 'interactive-widgets' && '["interactive-native","interactive-host"]' || inputs.surface == 'p1-input-repair' && '["incoming","intents"]' || inputs.surface == 'incoming-repair' && '["incoming","incoming-os"]' || format('["{0}"]', inputs.surface)) }}
    runs-on: ${{ inputs.ios_major == '27' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: ${{ matrix.surface == 'location-cold' && 25 || 30 }}
    env:
      TUIST_VERSION: "4.207.0"
      TUIST_SHA256: 583fec75cc187bb84a30509ba5afe7455607547be0917fdcf5899a7ef338305e
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate surface
        env:
          SURFACE: ${{ matrix.surface }}
          IOS_MAJOR: ${{ inputs.ios_major }}
        shell: bash
        run: |
          case "$IOS_MAJOR" in 26|27) ;; *) echo "Unsupported iOS major" >&2; exit 2 ;; esac
          case "$SURFACE" in p2-combined|ar-action|ble-scenes|identity-push|background-location|location-cold|media|continuing-live|continuing-alarm|continuing-host|continuing-state|interactive-native|interactive-host|intents|widgets|incoming|incoming-os|web-authentication|device-http|spotlight-cold-start) ;; *) exit 2 ;; esac

      - name: Select matching Xcode
        env:
          IOS_MAJOR: ${{ inputs.ios_major }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IOS_MAJOR" == 27 ]]; then
            sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
          else
            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version
          expected="Xcode 26.6"
          if [[ "$IOS_MAJOR" == 27 ]]; then expected="Xcode 27.0"; fi
          test "$(xcodebuild -version | sed -n '1p')" = "$expected"
          { sw_vers; xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-version; } > "$RUNNER_TEMP/platform.txt"

      - name: Install pinned Tuist
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tuist.zip" \
            "https://github.com/tuist/tuist/releases/download/$TUIST_VERSION/tuist.zip"
          echo "$TUIST_SHA256  $RUNNER_TEMP/tuist.zip" | shasum --algorithm 256 --check
          mkdir -p "$RUNNER_TEMP/tuist"
          ditto -x -k "$RUNNER_TEMP/tuist.zip" "$RUNNER_TEMP/tuist"
          echo "$RUNNER_TEMP/tuist" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tuist/tuist" version

      - name: Prepare simulator tests
        env:
          REQUESTED_RUNTIME: ${{ inputs.simulator_runtime }}
          SURFACE: ${{ matrix.surface }}
          IOS_MAJOR: ${{ inputs.ios_major }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          sim_id="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1]) as source:
              devices = json.load(source)['devices']
          major = os.environ['IOS_MAJOR']
          runtimes = [runtime for runtime in devices if runtime.startswith('com.apple.CoreSimulator.SimRuntime.iOS-' + major + '-')]
          requested = os.environ.get('REQUESTED_RUNTIME', '')
          if requested:
              runtimes = [runtime for runtime in runtimes if runtime.endswith('iOS-' + requested.replace('.', '-'))]
          if not runtimes:
              raise SystemExit('Requested iOS simulator runtime is not installed')
          runtime = max(runtimes, key=lambda value: tuple(map(int, value.split('iOS-')[1].split('-'))))
          family = 'iPad' if os.environ.get('SURFACE') in {'ble-scenes', 'p2-combined', 'location-cold'} else 'iPhone'
          candidates = [d for d in devices[runtime]
                        if d['name'].startswith(family) and d['isAvailable']]
          if not candidates:
              raise SystemExit('No available ' + family + ' simulator for iOS ' + major)
          candidates.sort(key=lambda d: (d['name'] != 'iPhone 16e', d['name']))
          print(candidates[0]['udid'])
          PY
          )"
          echo "SIMULATOR_ID=$sim_id" >> "$GITHUB_ENV"
          echo "selected-simulator=$sim_id" >> "$RUNNER_TEMP/platform.txt"
          xcrun simctl boot "$sim_id"
          xcrun simctl bootstatus "$sim_id" -b

      - name: Test BLE and scene shared logic
        if: matrix.surface == 'ble-scenes' || matrix.surface == 'p2-combined'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/BluetoothScenes"
          swift test --filter 'MiniAppBluetoothCoordinatorTests|MiniAppWindowSceneRegistryTests' 2>&1 | tee "$RUNNER_TEMP/BluetoothScenes/shared-tests.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'BluetoothScenes/shared-tests.log').read_text()
          for folder, name in [('Bluetooth', 'MiniAppBluetoothCoordinatorTests'), ('WindowScenes', 'MiniAppWindowSceneRegistryTests')]:
              source = Path(f'Tests/JibunKitCoreTests/{folder}/{name}.swift').read_text()
              methods = re.findall(r'func (test\w+)\(', source)
              if not methods:
                  raise SystemExit(f'No expected shared tests: {name}')
              for method in methods:
                  pattern = rf"Test Case '-\[(?:\w+\.)?{name} {method}\]' passed"
                  if len(re.findall(pattern, log)) != 1:
                      raise SystemExit(f'Missing or duplicate passing test: {name}.{method}')
          PY

      - name: Verify selected native surface
        env:
          SURFACE: ${{ matrix.surface }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SURFACE" in
            p2-combined)
              python3 -m unittest discover -s Tools/tests -p 'test_p2_combined*.py'
              python3 -m unittest discover -s Tools/tests -p 'test_media_verification.py'
              python3 Tools/verify-media.py --surface p2-combined --simulator-id "$SIMULATOR_ID"
              ;;
            ar-action)
              python3 -m unittest discover -s Tools/tests -p 'test_ar_action*.py'
              python3 -m unittest discover -s Tools/tests -p 'test_share_extension.py'
              python3 -m unittest discover -s Tools/tests -p 'test_media_verification.py'
              python3 Tools/verify-media.py --surface ar-action --simulator-id "$SIMULATOR_ID"
              ;;
            ble-scenes)
              python3 -m unittest discover -s Tools/tests -p 'test_ble_scenes*.py'
              python3 Tools/verify-media.py --surface ble-scenes --simulator-id "$SIMULATOR_ID"
              ;;
            identity-push)
              python3 -m unittest discover -s Tools/tests -p 'test_identity_push*.py'
              python3 Tools/verify-media.py --surface identity-push --simulator-id "$SIMULATOR_ID"
              ;;
            background-location)
              python3 -m unittest discover -s Tools/tests -p 'test_background_location*.py'
              python3 -m unittest discover -s Tools/tests -p 'test_media*.py'
              python3 Tools/verify-media.py --surface background-location --simulator-id "$SIMULATOR_ID"
              ;;
            location-cold)
              mkdir -p "$RUNNER_TEMP/LocationCold"
              python3 -m unittest Tools.tests.test_p2_combined_host
              python3 Tools/prepare-p2-combined-host.py --host .
              tuist generate --no-open
              xcodebuild build-for-testing -workspace JibunKit.xcworkspace -scheme P2LocationColdOSUITests \
                -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
                -derivedDataPath "$RUNNER_TEMP/LocationColdDerivedData" \
                CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
                2>&1 | tee "$RUNNER_TEMP/LocationCold/build.log"
              xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/LocationColdDerivedData/Build/Products/Debug-iphonesimulator/JibunKit_App.app"
              xcrun simctl privacy "$SIMULATOR_ID" grant location-always com.jibunkit.app
              set +e
              xcodebuild test-without-building -workspace JibunKit.xcworkspace -scheme P2LocationColdOSUITests \
                -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
                -derivedDataPath "$RUNNER_TEMP/LocationColdDerivedData" \
                -resultBundlePath "$RUNNER_TEMP/LocationCold/tests.xcresult" \
                -only-testing:P2LocationColdOSUITests/P2LocationColdOSUITests/testTerminatedGeofenceEnterAndExitPersistFromNewProcesses \
                -parallel-testing-enabled NO -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 240 \
                -maximum-test-execution-time-allowance 240 \
                CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
                2>&1 | tee "$RUNNER_TEMP/LocationCold/tests.log"
              test_status=${PIPESTATUS[0]}
              set -e
              if [[ -d "$RUNNER_TEMP/LocationCold/tests.xcresult" ]]; then
                set +e
                xcrun xcresulttool get test-results summary \
                  --path "$RUNNER_TEMP/LocationCold/tests.xcresult" \
                  > "$RUNNER_TEMP/LocationCold/xcresult-summary.json"
                summary_status=$?
                set -e
                if [[ "$summary_status" -ne 0 ]]; then
                  rm -f "$RUNNER_TEMP/LocationCold/xcresult-summary.json"
                fi
              fi
              TEST_STATUS="$test_status" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'LocationCold'
          status = int(os.environ['TEST_STATUS'])
          raw_path = root / 'xcresult-summary.json'
          raw = json.loads(raw_path.read_text()) if raw_path.is_file() else {}
          passed = raw.get('passedTests', 0)
          skipped = raw.get('skippedTests', 0)
          failed = raw.get('failedTests', 0)
          total = raw.get('totalTestCount', 0)
          if status != 0 or failed or total != 1:
              outcome = 'failure'
          elif passed == 1 and skipped == 0:
              outcome = 'observed-passed'
          elif passed == 0 and skipped == 1:
              outcome = 'unobserved-skip'
          else:
              outcome = 'failure'
          summary = {'outcome': outcome, 'xcodebuild_exit': status,
                     'passed': passed, 'skipped': skipped, 'failed': failed, 'total': total}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          github = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with github.open('a') as target:
              target.write(f"## Cold geofence diagnostic\n\nOutcome: **{outcome}**\n")
          if outcome == 'unobserved-skip':
              print('::warning title=Cold geofence unobserved::Simulator did not expose terminated-app Region delivery; this is not a product gate pass.')
          elif outcome == 'failure':
              raise SystemExit('Cold geofence diagnostic failed to compile, execute, or produce one valid result')
          PY
              ;;
            media)
              python3 -m unittest discover -s Tools/tests -p 'test_media*.py'
              python3 Tools/verify-media.py --simulator-id "$SIMULATOR_ID"
              ;;
            continuing-live|continuing-alarm|continuing-host|continuing-state)
              python3 Tools/verify-continuing-surfaces.py --mode "${SURFACE#continuing-}" --simulator-id "$SIMULATOR_ID"
              ;;
            interactive-native|interactive-host)
              python3 Tools/verify-interactive-widgets.py --mode "${SURFACE#interactive-}" --simulator-id "$SIMULATOR_ID"
              ;;
            incoming-os)
              python3 Tools/verify-incoming-os.py --simulator-id "$SIMULATOR_ID"
              ;;
            spotlight-cold-start)
              python3 Tools/verify-spotlight-cold-start.py --simulator-id "$SIMULATOR_ID"
              ;;
            device-http)
              python3 Tools/verify-p1-device-http.py --simulator-id "$SIMULATOR_ID"
              ;;
            intents)
              python3 -m unittest discover -s Tools/tests -p test_app_intents_identities.py
              python3 Tools/verify-package-app-intents.py --simulator-id "$SIMULATOR_ID" \
                2>&1 | tee "$RUNNER_TEMP/package-app-intents.log"
              ;;
            widgets)
              python3 Tools/verify-package-widgets-native.py --simulator-id "$SIMULATOR_ID" \
                2>&1 | tee "$RUNNER_TEMP/package-widgets.log"
              ;;
            incoming)
              tuist generate --no-open
              xcodebuild test -workspace JibunKit.xcworkspace -scheme IncomingNativeTests \
                -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
                -derivedDataPath "$RUNNER_TEMP/SimulatorDerivedData" \
                -resultBundlePath "$RUNNER_TEMP/IncomingNative.xcresult" \
                -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
                CODE_SIGN_STYLE=Manual 2>&1 | tee "$RUNNER_TEMP/incoming-native.log"
              ;;
            web-authentication)
              python3 Tools/verify-web-authentication-native.py --simulator-id "$SIMULATOR_ID" \
                2>&1 | tee "$RUNNER_TEMP/web-authentication-native.log"
              python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path('Tests/WebAuthenticationNative/UITests.swift').read_text()
          methods = re.findall(r'\bfunc\s+(test\w+)\s*\(', source)
          assert methods and len(methods) == len(set(methods)), 'Missing or duplicate native test methods'
          root = Path(os.environ['RUNNER_TEMP'])
          log = (root / 'web-authentication-native.log').read_text(errors='replace')
          for method in methods:
              pattern = rf"Test Case '-\[(?:[A-Za-z0-9_]+\.)?WebAuthenticationNativeUITests {re.escape(method)}\]' passed \("
              assert len(re.findall(pattern, log)) == 1, f'Expected one native pass for {method}'
          (root / 'WebAuthentication-tests.json').write_text(json.dumps({'passed': methods}, indent=2) + '\n')
          PY
              ;;
          esac

      - name: Export Spotlight service diagnostics
        if: always() && matrix.surface == 'spotlight-cold-start'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/SpotlightColdStart"
          xcrun simctl spawn "$SIMULATOR_ID" log show --style compact --last 20m \
            --predicate 'subsystem CONTAINS[c] "spotlight" OR process CONTAINS[c] "spotlight" OR eventMessage CONTAINS "IndexAgent"' \
            > "$RUNNER_TEMP/SpotlightColdStart/simulator-service.log" 2>&1

      - name: Export interactive management service diagnostics
        if: always() && matrix.surface == 'interactive-host'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/Interactive-host"
          xcrun simctl spawn "$SIMULATOR_ID" log show --info --style compact --last 25m \
            --predicate 'process == "JibunKit_App" OR process == "usernotificationsd" OR subsystem CONTAINS[c] "spotlight" OR process CONTAINS[c] "spotlight" OR eventMessage CONTAINS "IndexAgent"' \
            > "$RUNNER_TEMP/Interactive-host/simulator-service.log" 2>&1
          if [[ -d "$RUNNER_TEMP/Interactive-host/host-tests.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Interactive-host/host-tests.xcresult" \
              --output-path "$RUNNER_TEMP/Interactive-host/attachments"
          fi

      - name: Export native web screenshots and accessibility evidence
        if: always() && matrix.surface == 'web-authentication'
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/WebAuthentication.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/WebAuthentication.xcresult" \
              --output-path "$RUNNER_TEMP/WebAuthentication-attachments"
          fi

      - name: Upload surface diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Native-${{ matrix.surface }}-diagnostics
          path: |
            ${{ runner.temp }}/Continuing-live
            ${{ runner.temp }}/Continuing-alarm
            ${{ runner.temp }}/Continuing-host
            ${{ runner.temp }}/Continuing-state
            ${{ runner.temp }}/Media
            ${{ runner.temp }}/BackgroundLocation
            ${{ runner.temp }}/LocationCold
            ${{ runner.temp }}/P2Combined
            ${{ runner.temp }}/ARAction
            ${{ runner.temp }}/BluetoothScenes
            ${{ runner.temp }}/IdentityPush
            ${{ runner.temp }}/Interactive-native
            ${{ runner.temp }}/Interactive-host
            ${{ runner.temp }}/platform.txt
            ${{ runner.temp }}/simulators.json
            ${{ runner.temp }}/SpotlightColdStart
            ${{ runner.temp }}/P1DeviceHTTP
            ${{ runner.temp }}/package-app-intents.log
            ${{ runner.temp }}/PackageAppIntents
            ${{ runner.temp }}/package-widgets.log
            ${{ runner.temp }}/PackageWidgets
            ${{ runner.temp }}/IncomingNative.xcresult
            ${{ runner.temp }}/incoming-native.log
            ${{ runner.temp }}/IncomingOS/tests.log
            ${{ runner.temp }}/IncomingOS/Tests.xcresult
            ${{ runner.temp }}/web-authentication-native.log
            ${{ runner.temp }}/WebAuthentication.xcresult
            ${{ runner.temp }}/WebAuthentication-tests.json
            ${{ runner.temp }}/WebAuthentication-attachments
          if-no-files-found: warn
          retention-days: 14
